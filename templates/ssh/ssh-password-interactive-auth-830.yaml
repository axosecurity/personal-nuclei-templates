id: ssh-password-interactive-auth-830

info:
  name: SSH Password / Keyboard-Interactive Authentication Detection (Port 830)
  author: axo
  severity: info
  description: |
    Detects SSH services on port 830 (NETCONF over SSH) with interactive password authentication enabled,
    supporting standard RFC 4252 "password" method and PAM "keyboard-interactive" method.
  reference:
    - https://nmap.org/nsedoc/scripts/ssh-auth-methods.html
  metadata:
    max-request: 2
    shodan-query: product:"OpenSSH"
  tags: ssh,js,enum,network,discovery,axopass,axossh

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var m = require("nuclei/ssh");
      var c = m.SSHClient();
      var response = c.ConnectSSHInfoMode(Host, Port);
      Export(response);
    args:
      Host: "{{Host}}"
      Port: "830"

    matchers-condition: and
    matchers:
      - type: word
        part: response
        words:
          - '"UserAuth":'
      - type: regex
        part: response
        regex:
          - '"(password|keyboard-interactive)"'

    extractors:
      - type: json
        json:
          - '.UserAuth'
