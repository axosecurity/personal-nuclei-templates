id: ssh-server-software-enum

info:
  name: SSH Server Software & Version Enumeration
  author: axo
  severity: info
  description: |
    Enumerates SSH server software version string and banner information.
  reference:
    - https://nmap.org/nsedoc/scripts/ssh-auth-methods.html
  metadata:
    max-request: 2
    shodan-query: product:"OpenSSH"
  tags: js,ssh,enum,network,axossh

javascript:
  - pre-condition: |
      isPortOpen(Host,Port);
    code: |
      var m = require("nuclei/ssh");
      var c = m.SSHClient();
      var response = c.ConnectSSHInfoMode(Host, Port);
      Export(response);
    args:
      Host: "{{Host}}"
      Port: "22"

    extractors:
      - type: json
        json:
          - '.ServerID.Raw'
